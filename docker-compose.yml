# Fixed project name: the volume is always grafinya-panel_grafinya_data,
# even if the repository is cloned into a folder with a different name.
name: grafinya-panel

volumes:
  grafinya_data:

services:
  grafinya:
    #environment:
    #  Optional:
    #  - PORT=51821
    #  - HOST=0.0.0.0
    #  - INSECURE=false
    #  - PUBLIC_HOST=vpn.example.com   # address for clients; detected automatically by default
    #  - VPN_PORT=51820   # must match the port in ports: below
    #  - OVERRIDE_AUTO_AWG=wg   # disable Grafinya obfuscation (plain tunnel mode)

    # No prebuilt image in a registry yet: built from this repository.
    build: .
    image: grafinya-panel:latest
    container_name: grafinya
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    volumes:
      - grafinya_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    # The tunnel runs through /dev/net/tun when the server kernel lacks the module
    # (true for most VPS). Without this device the tunnel will not start.
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
