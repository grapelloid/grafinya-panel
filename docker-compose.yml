# Фиксированное имя проекта: том всегда называется grafinya-panel_grafinya_data,
# даже если репозиторий склонирован в папку с другим именем.
name: grafinya-panel

volumes:
  grafinya_data:

services:
  grafinya:
    #environment:
    #  Optional:
    #  - PORT=51821
    #  - HOST=0.0.0.0
    #  - INSECURE=false
    #  - PUBLIC_HOST=vpn.example.com   # адрес для клиентов; по умолчанию определяется сам
    #  - VPN_PORT=51820   # должен совпадать с портом в ports: ниже
    #  - OVERRIDE_AUTO_AWG=wg   # выключить обфускацию Grafinya (режим без маскировки)

    # Готового образа в реестре пока нет — собирается из этого репозитория.
    build: .
    image: grafinya-panel:latest
    container_name: grafinya
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    volumes:
      - grafinya_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    # Туннель в контейнере работает через /dev/net/tun, если в ядре сервера нет нужного модуля
    # (так на большинстве VPS). Без этого устройства туннель не поднимется.
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
